<!DOCTYPE html>
<html>

<head>
    <title>OpenTrickler Setup Wizard</title>
    <link rel="service-doc" href="/api/v1">
    <link rel="service-desc" href="/api/v1/schema">
    <meta name="viewport" content="width=device-width, initial-scale=1.0 viewport-fit=cover">

    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            background-color: #f1f1f1;
        }
        
        .reg-form {
            background-color: #ffffff;
            margin: 10px auto;
            font-family: Raleway;
            padding: 30px;
            width: 70%;
            min-width: 300px;
        }

        .button-group {
            overflow: auto;
            text-align: right;
        }

        .option-group {
            margin: 20px auto;
        }
        
        h1 {
            text-align: center;  
        }
        
        input {
            padding: 10px;
            width: 100%;
            font-size: 17px;
            font-family: Raleway;
            border: 1px solid #aaaaaa;
        }

        select {
            padding: 10px;
            width: 100%;
            font-size: 17px;
            font-family: Raleway;
            border: 1px solid #aaaaaa;
        }


        
        /* Mark input boxes that gets an error on validation: */
        input.invalid {
            background-color: #ffdddd;
        }
        
        /* Hide all steps by default: */
        /* .tab {
          display: none;
        } */
        
        button {
            background-color: #2b3440;
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            font-size: 17px;
            font-family: Raleway;
            cursor: pointer;
        }
        
        button:hover {
            opacity: 0.8;
        }
        
        .inactive-button {
            background-color: #bbbbbb;
        }
        
        /* Make circles that indicate the steps of the form: */
        .step {
            height: 15px;
            width: 15px;
            margin: 0 2px;
            background-color: #bbbbbb;
            border: none;  
            border-radius: 50%;
            display: inline-block;
            opacity: 0.5;
        }
        
        .step.active {
            opacity: 1;
        }
        
        /* Mark the steps that are finished and valid: */
        .step.finish {
            background-color: #04AA6D;
        }

        table {
            font-family: arial, sans-serif;
            border-collapse: collapse;
            width: 100%;
            margin: 32px;
        }

        td, th {
            text-align: left;
            padding: 8px;
        }

        tr:nth-child(even) {
            background-color: #dddddd;
        }
    </style>
</head>

<body>
    <h1>Configure WiFi</h1>

    <div class="reg-form">
        <form id="wifi-config">
            <!-- One "tab" for each step in the form: -->
            <div class="option-group">
                <span>SSID</span>
                <input type="text" name="ssid" maxlength="31">
            </div>

            <div class="option-group">
                <span>Password</span>
                <input type="password" name="key" maxlength="63" placeholder="********">
            </div>

            <div class="option-group">
                <span>WiFi Authentication Method</span>
                <select name="auth">
                    <option value="open">None</option>
                    <option value="wpa_tkip">WPA-TKIP</option>
                    <option value="wpa2_aes">WPA2-AES</option>
                    <option value="wpa2_mixed">WPA2-MIXED</option>
                </select>
            </div>

            <div class="option-group">
                <span>WiFi Attempt to Connect Timeout (ms)</span>
                <input type="number" name="timeout_ms" step="1000" value="30000">
            </div>

            <div class="option-group">
                <span>Enable WiFi</span>
                <select name="enable">
                    <option value="true">Yes</option>
                    <option value="false">No</option>
                </select>
            </div>

            <div class="button-group">
                <button type="button" id="submit-btn">Complete & Reboot</button>
            </div>
            <p id="wifi-status"></p>
        </form>
    </div>


    <script>
        // API v1 (ADR-003, gate 4): the Wi-Fi written, stored, and only then the restart asked, each once the last
        // is answered. A refusal is shown in the unit's own words
        const jsonHeaders = {"Content-Type": "application/json"};

        function showStatus(text) {
            document.getElementById("wifi-status").textContent = text;
        }

        async function refusal(response) {
            try {
                const error = (await response.json()).error || {};
                return (error.field ? error.field + ": " : "") + (error.message || response.status);
            }
            catch (exception) {
                return `refused (${response.status})`;
            }
        }

        function wifiBody(form) {
            const body = {};
            for (const [key, value] of new FormData(form).entries()) {
                if (value === "") {
                    continue;
                }
                body[key] = key === "timeout_ms" ? Number(value) : key === "enable" ? value === "true" : value;
            }
            return body;
        }

        document.getElementById("submit-btn").addEventListener("click", async (event) => {
            event.preventDefault();
            const form = document.getElementById("wifi-config");
            const steps = [["PATCH", "/api/v1/settings/wifi", wifiBody(form), "Not taken"],
                           ["POST", "/api/v1/settings/wifi/save", {}, "Not stored"],
                           ["POST", "/api/v1/system/restart", {}, "Stored, but the unit did not restart"]];
            for (const [method, path, body, title] of steps) {
                const response = await fetch(path, {method: method, headers: jsonHeaders, body: JSON.stringify(body)});
                if (!response.ok) {
                    showStatus(`${title}: ${await refusal(response)}`);
                    return;
                }
            }
            showStatus("Stored. The unit restarts and joins the network.");
        })

        function populateWifiConfig() {
            const form = document.getElementById("wifi-config");
            fetch("/api/v1/settings/wifi")
            .then(response => response.json())
            .then(data => {
                for (const key in data) {
                    const element = form.querySelector('[name="' + key + '"]');
                    if (element) {
                        element.value = String(data[key]);
                    }
                }
            })
        }

        // Start the long polling process when the page loads
        document.addEventListener('DOMContentLoaded', function() {populateWifiConfig();});
    </script>
</body>
</html>
