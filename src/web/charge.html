<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>OpenTrickler</title>
<link rel="service-doc" href="/api/v1">
<link rel="service-desc" href="/api/v1/schema">
<style>/*STYLE*/</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10l-3.5 6v6L10.5 17V9z"/><path d="M12 19.5v.5"/></svg>
    <span id="unit-name">OpenTrickler</span>
  </div>
  <span id="link" class="link"><i></i><b>Connecting</b></span>
</header>

<main class="page">
  <section id="panel" class="panel" data-state="idle" data-feature="16 17 18 19 20 21 26 29">
    <div class="panel-head">
      <label class="powder">
        <span class="kicker">Powder</span>
        <select id="powder"></select>
      </label>
      <span id="elapsed" class="time">-.-- s</span>
    </div>

    <div class="dial">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <circle class="track" cx="100" cy="100" r="88"/>
        <circle id="ring" class="arc" cx="100" cy="100" r="88" pathLength="1000"/>
      </svg>
      <div class="dial-text">
        <div id="weight" class="figure">---</div>
        <div class="unit">grains</div>
        <div class="target">target <b id="target-shown">--</b></div>
      </div>
    </div>

    <div id="status" class="status">Ready</div>

    <ol id="steps" class="steps">
      <li data-state="zeroing">Zero</li>
      <li data-state="charging">Charge</li>
      <li data-state="waiting_for_cup_removal">Lift cup</li>
      <li data-state="waiting_for_cup_return">Return cup</li>
    </ol>
  </section>

  <div class="side">
    <section class="card" data-feature="22 23 24 25 27 34">
      <label class="kicker" for="target">Target, grains</label>
      <div class="stepper">
        <button class="key" data-step="-1" aria-label="Less">&minus;</button>
        <input id="target" type="number" inputmode="decimal" step="0.001" min="0.001">
        <button class="key" data-step="1" aria-label="More">+</button>
      </div>
      <button id="start" class="action go">Start charge</button>
      <button id="stop" class="action halt" hidden>Stop</button>
      <div class="row">
        <button id="zero" class="ghost">Zero the scale</button>
        <label class="switch"><input id="awake" type="checkbox" checked><span></span>Keep screen awake</label>
      </div>
    </section>

    <section class="card" data-feature="30 31 32 33">
      <div class="card-head">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3M18 3v4h-4M6 21v-4h4"/></svg>
        <h2>Purge</h2>
      </div>
      <div id="purge-idle">
        <p class="hint">Runs both tricklers to empty them into the cup.</p>
        <button id="purge-start" class="ghost wide">Start purge</button>
      </div>
      <div id="purge-running" hidden>
        <div class="stepper">
          <button class="key" data-speed="-1" aria-label="Slower">&minus;</button>
          <div class="speed"><b id="speed">0.0</b><span>rev/s</span></div>
          <button class="key" data-speed="1" aria-label="Faster">+</button>
        </div>
        <button id="purge-stop" class="action halt">Stop purge</button>
      </div>
    </section>

    <p id="message" class="message" role="status"></p>
  </div>
</main>

<nav class="nav">
  <a class="on" href="#charge"><svg viewBox="0 0 24 24"><path d="M12 4v16M5 20h14M4 8h16M7 8l-3 6a3 3 0 0 0 6 0zM17 8l-3 6a3 3 0 0 0 6 0z"/></svg>Charge</a>
  <a href="#powders"><svg viewBox="0 0 24 24"><path d="M8 3h8v3H8zM6 6h12v13a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2zM6 12h12"/></svg>Powders</a>
  <a href="#settings"><svg viewBox="0 0 24 24"><path d="M4 6h9m4 0h3M4 12h3m4 0h9M4 18h11m4 0h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg>Settings</a>
  <a href="#unit"><svg viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="1.5"/><path d="M10 3v4M14 3v4M10 17v4M14 17v4M3 10h4M3 14h4M17 10h4M17 14h4"/></svg>Unit</a>
</nav>

<dialog id="cup" class="sheet">
  <form method="dialog">
    <svg class="cup" viewBox="0 0 64 64" aria-hidden="true"><path d="M18 22h28l-3 30a3 3 0 0 1-3 3H24a3 3 0 0 1-3-3zM10 58h44"/><path class="drop" d="M32 6c-3 5-4 7-4 9a4 4 0 0 0 8 0c0-2-1-4-4-9z"/></svg>
    <h3>Put the empty cup on the scale</h3>
    <p>To catch the powder.</p>
    <div class="sheet-actions">
      <button class="ghost" value="no">Not yet</button>
      <button class="action go" value="yes">The cup is on</button>
    </div>
  </form>
</dialog>

<script>/*SCRIPT*/</script>
</body>
</html>
