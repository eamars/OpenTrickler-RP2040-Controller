name: Auto Release Build

run-name: Build based on ${{ github.ref }} by @${{ github.actor }}


on:
  push:
    branches: [ "main" ]
    # A version tag also drafts a release from its build (ADR-004, gate 3); the owner publishes it after trying it
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    # The runner's own compiler and tools are not used: the build takes the compiler, CMake, Ninja, pioasm and
    # picotool named in toolchain.env, the same a PC uses (ADR-011). So a new runner image does not change the
    # build, and the runner is not pinned.
    runs-on: ubuntu-latest
    permissions:
      contents: write   # a version tag drafts a release

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0          # Fetch all branches and tags
        submodules: recursive   # Automatically pull all submodules

    # Fetched again when a version in toolchain.env or the fetch script changes
    - name: Cache the toolchain
      id: toolchain-cache
      uses: actions/cache@v6
      with:
        path: .toolchain
        key: toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchain.env', 'setup_toolchain.sh') }}

    - name: Fetch the toolchain named in toolchain.env
      if: steps.toolchain-cache.outputs.cache-hit != 'true'
      run: ./setup_toolchain.sh

    # The firmware's own C that needs no unit, built for the runner and run (tests/host_test.py): the PC build
    # (tests/host, ADR-006, gate 4) takes the modules by their own build files, so a module meant to be free of the
    # chip that is not fails here. Its test: the loader keeping an earlier version's settings (ADR-009, gate 2).
    # The toolchain's CMake and Ninja, found in .toolchain; the runner's gcc, as a PC's zig
    - name: Host tests
      run: python3 tests/host_test.py

    # The layers (ADR-006): no requirement upward, no loop, no SDK or radio include outside platform/ and boards/, no
    # part's switch read outside app/. The compiler holds none of these (tools/module_graph.py reads the build files)
    - name: The modules against the layers
      run: python3 tools/module_graph.py

    # No web feature silently dropped (ADR-008): every row of features.md shown by the pages or left out by decision
    - name: The web's features
      run: python3 tests/features_check.py --final

    # A release's five builds and its folder, as a PC makes them with the same script (ADR-004, gate 3): each board's
    # full install, the update images (the Pico W's for each slot), each named with the version,
    # manifest.json and SHA256SUMS. On every build, so every pull request shows the release it would make. On a tag
    # the script refuses a firmware that does not report the tag's version and a tag without its notes
    # (docs/releases/README.md), and gives each file its address on the release
    - name: Build the release
      shell: bash
      run: |
        source ./configure_env.sh
        tag=()
        if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
          tag=(--tag "$GITHUB_REF_NAME" --repository "$GITHUB_REPOSITORY")
        fi
        python3 scripts/build_release.py --out-dir release "${tag[@]}"

    # The stored records against the latest release, the release a unit updates from (tests/release_records.py): found
    # by use, each record's release fields first in today's, each stored enum value meaning what it meant (needs the
    # tags, above); and from both images' DWARF, each release field where it lay, no field appended into the release's
    # tail padding, and both compilers' layouts the same (ADR-017, gate 1). pyelftools reads the DWARF
    - name: Stored records against the latest release
      run: |
        # The runner's Python may be marked as the system's own (PEP 668): then installed past the mark
        python3 -m pip install --quiet pyelftools==0.33 ||
          python3 -m pip install --quiet --break-system-packages pyelftools==0.33
        python3 tests/release_records.py --elf build_release/pico_w/app.elf --elf build_release/pico2_w/app.elf

    # Flash by part and RAM at link time, in the job summary and in the log (ADR-001).
    # "shell: bash" runs with pipefail, so a report that fails still fails the step through tee.
    - name: Size of the Pico2 W image
      shell: bash
      run: python3 tools/size_report.py build_release/pico2_w/app.elf.map --bin build_release/pico2_w/app.bin --title "Pico 2 W" --markdown | tee -a "$GITHUB_STEP_SUMMARY"

    - name: Size of the Pico W image
      shell: bash
      run: python3 tools/size_report.py build_release/pico_w/app.elf.map --bin build_release/pico_w/app.bin --title "Pico W" --markdown | tee -a "$GITHUB_STEP_SUMMARY"

    - name: Archive the Pico2 W build
      uses: actions/upload-artifact@v7
      with:
        name: pico2_w_package
        path: |
          src/generated/version.c
          build_release/pico2_w/*.bin
          build_release/pico2_w/*.dis
          build_release/pico2_w/*.elf
          build_release/pico2_w/*.map
          build_release/pico2_w/*.hex
          build_release/pico2_w/*.uf2

    - name: Archive the Pico W build
      uses: actions/upload-artifact@v7
      with:
        name: pico_w_package
        path: |
          src/generated/version.c
          build_release/pico_w/*.bin
          build_release/pico_w/*.dis
          build_release/pico_w/*.elf
          build_release/pico_w/*.map
          build_release/pico_w/*.hex
          build_release/pico_w/*.uf2

    - name: Archive the release
      uses: actions/upload-artifact@v7
      with:
        name: release
        path: release/

    # A draft, as a pre-release: the owner publishes it after trying it on a unit, and a candidate stays a pre-release.
    # The final is the candidate the owner promotes, so GitHub's latest release, the units' default source, never
    # leads to a candidate (ADR-004, gate 3). The notes are written by hand, as the Open Weapon Mount Computer's
    - name: Draft the release
      if: startsWith(github.ref, 'refs/tags/v')
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
      run: |
        # The notes without their title (the release has its own), with links into the repository pinned to the tag
        tail -n +2 "docs/releases/$TAG.md" | sed -e '1{/^$/d}' \
          -e "s#](\.\./\.\./#](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/#g" \
          -e "s#](\.\./#](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/docs/#g" > body.md
        printf '\nSHA-256:\n\n```\n%s\n```\n' "$(cat release/SHA256SUMS)" >> body.md
        gh release create "$TAG" release/OpenTrickler-* release/manifest.json release/SHA256SUMS \
          --draft --prerelease --verify-tag --title "OpenTrickler $TAG" --notes-file body.md
