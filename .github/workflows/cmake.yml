name: Auto Release Build

run-name: Build based on ${{ github.ref }} by @${{ github.actor }}


on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# env:
#   # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
#   PICO_BOARD: pico_w

jobs:
  build:
    # The runner's own compiler and tools are not used: the build takes the compiler, CMake, Ninja, pioasm and
    # picotool named in toolchain.env, the same a PC uses (ADR-011). So a new runner image does not change the
    # build, and the runner is not pinned.
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0          # Fetch all branches and tags
        submodules: recursive   # Automatically pull all submodules

    # Fetched again when a version in toolchain.env or the fetch script changes
    - name: Cache the toolchain
      id: toolchain-cache
      uses: actions/cache@v4
      with:
        path: .toolchain
        key: toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchain.env', 'setup_toolchain.sh') }}

    - name: Fetch the toolchain named in toolchain.env
      if: steps.toolchain-cache.outputs.cache-hit != 'true'
      run: ./setup_toolchain.sh

    # Build Pico2 W support package into build_pico2_w
    - name: Build Pico2 W Package
      run: |
        source ./configure_env.sh
        cmake -B ${{github.workspace}}/build_pico2_w -G Ninja -DCMAKE_BUILD_TYPE=Debug -DPICO_BOARD=pico2_w
        cmake --build ${{github.workspace}}/build_pico2_w --config Debug

    # Flash by part and RAM at link time, in the job summary and in the log (ADR-001).
    # "shell: bash" runs with pipefail, so a report that fails still fails the step through tee.
    - name: Size of the Pico2 W image
      shell: bash
      run: python3 tools/size_report.py build_pico2_w/app.elf.map --bin build_pico2_w/app.bin --title "Pico 2 W" --markdown | tee -a "$GITHUB_STEP_SUMMARY"

    - name: Archive Debug Artifact
      uses: actions/upload-artifact@v4
      with: 
        name: pico2_w_package
        path: |
          src/generated/version.c  
          build_pico2_w/*.bin
          build_pico2_w/*.dis
          build_pico2_w/*.elf
          build_pico2_w/*.map
          build_pico2_w/*.hex
          build_pico2_w/*.uf2

    # Build Pico W support package into build_pico_w
    - name: Build Pico W Package
      run: |
        source ./configure_env.sh
        cmake -B ${{github.workspace}}/build_pico_w -G Ninja -DCMAKE_BUILD_TYPE=Debug -DPICO_BOARD=pico_w
        cmake --build ${{github.workspace}}/build_pico_w --config Debug

    - name: Size of the Pico W image
      shell: bash
      run: python3 tools/size_report.py build_pico_w/app.elf.map --bin build_pico_w/app.bin --title "Pico W" --markdown | tee -a "$GITHUB_STEP_SUMMARY"

    - name: Archive Debug Artifact
      uses: actions/upload-artifact@v4
      with: 
        name: pico_w_package
        path: |
          src/generated/version.c  
          build_pico_w/*.bin
          build_pico_w/*.dis
          build_pico_w/*.elf
          build_pico_w/*.map
          build_pico_w/*.hex
          build_pico_w/*.uf2
